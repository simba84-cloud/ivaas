[project]
name = "ivaas-api"
version = "0.1.0"
description = "IVaaS core API: sites, bays, cameras, loading sessions and reconciliation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "nats-py>=2.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "aioboto3>=13",
    "python-multipart>=0.0.12",
    # [lpr] pulls fast-alpr: without it uploaded videos are analysed with no plate reading
    "ivaas-pipeline[lpr]",
    "argon2-cffi>=25.1.0",
]

[tool.uv.sources]
ivaas-pipeline = { path = "../pipeline", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivaas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: needs Docker for a throwaway Postgres (deselect with -m 'not postgres')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.mypy]
strict = true
mypy_path = "src"
