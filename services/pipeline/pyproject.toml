[project]
name = "ivaas-pipeline"
version = "0.1.0"
description = "IVaaS edge AI pipeline: detect, track, count and fuse crate crossings"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Licence plate recognition (MIT): YOLO plate detector + plate OCR, both ONNX
lpr = ["fast-alpr>=0.1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivaas_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["golden: runs the real ONNX models on a real clip (slow; needs models/)"]

[tool.ruff]
line-length = 100
target-version = "py312"
