[project]
name = "ivaas-ml"
version = "0.1.0"
description = "IVaaS model workflow: extract frames, pre-label, train, export to ONNX, evaluate"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Zero-shot pre-labelling (Apache-2.0 models via Hugging Face transformers)
prelabel = ["torch>=2.5", "transformers>=4.46", "pillow>=11"]
# Fine-tune RT-DETR (Apache-2.0) and export to ONNX
train = ["torch>=2.5", "torchvision>=0.20", "scipy>=1.14", "transformers>=4.46", "pillow>=11", "onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivaas_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
