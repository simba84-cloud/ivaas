# Label Studio (Apache-2.0) for annotating crate frames.
#   docker compose -f ml/labeling/docker-compose.yml up -d    -> http://localhost:8090
name: ivaas-labeling
services:
  label-studio:
    image: heartexlabs/label-studio:latest
    ports: ["8090:8080"]
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - lsdata:/label-studio/data
      - ../data/frames:/label-studio/files/frames:ro
      - ../data/crops:/label-studio/files/crops:ro
    restart: unless-stopped
volumes:
  lsdata:
