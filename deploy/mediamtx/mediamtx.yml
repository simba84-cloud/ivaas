# MediaMTX restreams NVR/camera RTSP to the portal (WebRTC) and the pipeline (RTSP).
# Replace the `source` URLs with the real camera or NVR channel URLs on site, e.g.
#   source: rtsp://user:pass@192.168.1.10:554/Streaming/Channels/101
# Control API: the core API adds/removes camera paths here at runtime. Reachable only
# on the compose network (the port is deliberately not published in docker-compose.yml).
api: yes
apiAddress: :9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

webrtc: yes
webrtcAddress: :8889
# Browsers connect to the media port directly, so MediaMTX must advertise an address
# they can reach. The host is set from docker-compose via MTX_WEBRTCADDITIONALHOSTS
# (IVAAS_MEDIA_HOST: the edge node's LAN IP on site, localhost on a laptop).
# TCP is offered too: it survives Docker NAT where UDP does not.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [localhost]
rtspAddress: :8554
hls: no
rtmp: no
srt: no

# Evidence clips (proposal M2). The API switches recording on for the cameras whose
# video is evidence (chokepoint and LPR by default: IVAAS_EVIDENCE_ROLES), not for all
# of them: 17 4K streams would need hundreds of GB even for a short buffer. What is
# recorded here is a rolling buffer on the edge node; the node cuts a few seconds
# around each count out of it through the playback server and uploads only those.
playback: yes
playbackAddress: :9996
pathDefaults:
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  # a clip can be cut this soon after the moment it shows
  recordPartDuration: 1s
  recordSegmentDuration: 1m
  # the buffer: long enough for an upload backlog to catch up, short enough for the disk
  recordDeleteAfter: 30m

paths:
  # Accepts any publisher under bay-poc/*, so recorded footage can be replayed with:
  #   ffmpeg -re -stream_loop -1 -i clip.mp4 -c copy -f rtsp rtsp://localhost:8554/bay-poc/chokepoint-1
  "~^bay-poc/.+$":
    source: publisher
