global:
  scrape_interval: 15s
scrape_configs:
  - job_name: ivaas-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ["nats:8222"]
  # the edge pipeline (compose profile "edge"): frame lag, processing time, dropped frames
  - job_name: ivaas-pipeline
    static_configs:
      - targets: ["pipeline:9102"]
