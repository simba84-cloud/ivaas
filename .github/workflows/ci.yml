name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ${{ matrix.service }} (python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [services/api, services/pipeline, ml]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.13
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Test
        # GitHub runners have Docker, so the Postgres-backed repository tests run here too
        run: uv run pytest -q

  web:
    name: web (vitest, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test --silent
      - run: npm run build

  e2e:
    name: web end to end (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the API
        working-directory: services/api
        run: uv sync --python 3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  golden:
    name: pipeline golden footage (real models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fetch models
        run: ../../deploy/fetch-models.sh
      - name: Install
        run: uv sync --python 3.13
      - name: Golden test
        run: uv run pytest -q -m golden

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: IVAAS_SECRETS_KEY=ci docker compose config -q
      # the install-day rehearsal's services (deploy/install/rehearsal.compose.yml)
      - run: IVAAS_SECRETS_KEY=ci docker compose -f docker-compose.yml -f deploy/install/rehearsal.compose.yml --profile rehearsal config -q
